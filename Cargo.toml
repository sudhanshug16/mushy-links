[workspace]
members = ["crates/mushy-core", "crates/mushy"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
notify = "8"
tempfile = "3"
directories = "6"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
filetime = "0.2"
globset = "0.4"
unicode-normalization = "0.1"
cap-std = "3"
cap-fs-ext = "3"
keyring = "3"
rpassword = "7"

[profile.release]
lto = "thin"
strip = true
